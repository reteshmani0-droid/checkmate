<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#302E2B">
    <meta name="description" content="Checkmate — play chess against a friend on this device or online, or against a bot at four strengths.">
    <title>Checkmate — play chess</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2381B64C'/%3E%3Ctext x='32' y='47' font-size='42' text-anchor='middle' fill='%23142109'%3E%E2%99%9E%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <noscript><p class="noscript">Checkmate needs JavaScript to play chess.</p></noscript>

    <!-- ---------------------------------------------------------------- home -->
    <section class="screen screen--home" id="homeScreen">
        <div class="home">
            <header class="brand">
                <div class="brand__mark" id="brandMark"></div>
                <div class="brand__text">
                    <h1>Checkmate</h1>
                    <p>Play a friend here, online, or take on the bot.</p>
                </div>
            </header>

            <div class="card">
                <div class="field">
                    <span class="label">Opponent</span>
                    <div class="seg" id="modeSeg" role="tablist" aria-label="Opponent">
                        <button class="seg__item" data-mode="bot" role="tab">Bot</button>
                        <button class="seg__item" data-mode="friend" role="tab">A friend</button>
                        <button class="seg__item" data-mode="online" role="tab">Online</button>
                    </div>
                </div>

                <div id="botOptions">
                    <div class="levels" id="levelCards"></div>
                    <div class="field">
                        <span class="label">Engine strength</span>
                        <input type="range" id="levelSlider" min="1" max="4" step="1" value="2" class="slider">
                        <div class="slider__labels">
                            <span>Pawn</span><span>Knight</span><span>Rook</span><span>Queen</span>
                        </div>
                    </div>

                    <div class="field">
                        <span class="label">Play as</span>
                        <div class="seg seg--sm" id="sideSeg" role="tablist" aria-label="Your colour">
                            <button class="seg__item" data-side="w" role="tab">White</button>
                            <button class="seg__item" data-side="random" role="tab">Random</button>
                            <button class="seg__item" data-side="b" role="tab">Black</button>
                        </div>
                    </div>
                </div>

                <div id="friendOptions" hidden>
                    <label class="switch">
                        <input type="checkbox" id="autoFlipSwitch">
                        <span class="switch__track"><span class="switch__knob"></span></span>
                        <span class="switch__text">Turn the board for each player</span>
                    </label>
                </div>

                <div id="onlineOptions" hidden>
                    <p class="online__hint">Create a game and share the code, or join one a friend sent you.</p>
                    <div class="online__actions">
                        <button class="btn btn--primary" id="createGameBtn">Create a game</button>
                        <button class="btn btn--subtle" id="joinGameBtn">Join a game</button>
                    </div>
                </div>

                <div class="field">
                    <span class="label">Time</span>
                    <div class="chips" id="timeChips"></div>
                </div>

                <button class="btn btn--primary btn--block btn--lg" id="startBtn">Play</button>
                <button class="btn btn--subtle btn--block" id="resumeBtn" hidden></button>
            </div>

            <footer class="home__foot">
                <div class="themes" id="themeRow"></div>
                <button class="iconbtn" id="soundToggle" aria-label="Sound"></button>
            </footer>

            <p class="stats" id="statsLine"></p>
        </div>
    </section>

    <!-- ---------------------------------------------------------------- game -->
    <section class="screen screen--game" id="gameScreen" hidden>
        <header class="gamebar">
            <button class="iconbtn" id="backBtn" aria-label="Back to home"></button>
            <div class="gamebar__title">
                <strong id="modeLabel">Bot</strong>
                <span id="statusLine" aria-live="polite">Your move</span>
            </div>
            <button class="iconbtn" id="menuBtn" aria-label="Game settings"></button>
        </header>

        <div class="arena">
            <div class="seat-slot" id="seatTop"></div>
            <div class="boardwrap" id="boardHost"></div>
            <div class="seat-slot" id="seatBottom"></div>
        </div>

        <div class="panel">
            <div class="controls">
                <button class="ctl" id="undoBtn"><span>Undo</span></button>
                <button class="ctl" id="hintBtn"><span>Hint</span></button>
                <button class="ctl" id="flipBtn"><span>Flip</span></button>
                <button class="ctl" id="resignBtn"><span>Resign</span></button>
            </div>

            <div class="reviewbar" id="reviewBar" hidden>
                <button class="iconbtn iconbtn--sm" id="reviewBack" aria-label="Previous move"></button>
                <span class="reviewbar__text" id="reviewText"></span>
                <button class="iconbtn iconbtn--sm" id="reviewNext" aria-label="Next move"></button>
                <button class="btn btn--subtle btn--sm" id="reviewLive">Live</button>
            </div>

            <div class="resultbanner" id="resultBanner" hidden></div>

            <div class="evalbar" id="evalBar" hidden>
                <div class="evalbar__fill" id="evalFill"></div>
                <span class="evalbar__label" id="evalLabel">0.0</span>
            </div>

            <div class="debug" id="debugPanel" hidden>
                <div><b>depth</b> <span id="dbgDepth">-</span></div>
                <div><b>nodes</b> <span id="dbgNodes">-</span></div>
                <div><b>score</b> <span id="dbgScore">-</span></div>
                <div><b>ms</b> <span id="dbgMs">-</span></div>
                <button class="btn btn--subtle btn--sm" id="analyzeBtn">Analyze</button>
            </div>

            <div class="moves">
                <ol class="moves__list" id="moveList"></ol>
            </div>
        </div>
    </section>

    <div class="overlay" id="overlay" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
